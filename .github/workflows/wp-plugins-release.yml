name: WordPress plugin releases

# Each plugin is released independently. A source-version bump produces one ZIP,
# one GitHub release tag, and one updates.json entry for that plugin only.

on:
  push:
    branches: [ main ]
    paths:
      - 'WordPress/Plugins/**'
      - '.github/workflows/wp-plugins-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find independently versioned plugins
        id: plan
        run: |
          set -euo pipefail
          mkdir -p build

          python3 <<'PY' > build/release-plan.json
          import json
          import os
          import re
          import sys

          root = "WordPress/Plugins"
          manifest_path = os.path.join(root, "updates.json")
          manifest = {"plugins": {}}
          if os.path.exists(manifest_path):
              with open(manifest_path, encoding="utf-8") as fh:
                  manifest = json.load(fh)

          def parse_version(value):
              match = re.fullmatch(r"(\d{4})-(\d{2})__(\d+)\.(\d{1,2})", value or "")
              if not match:
                  raise ValueError(f"invalid plugin version: {value!r}")
              return tuple(map(int, match.groups()))

          plan = []
          for slug in sorted(os.listdir(root)):
              main = os.path.join(root, slug, f"{slug}.php")
              if not os.path.isfile(main):
                  continue
              header = open(main, encoding="utf-8").read(4096)
              match = re.search(r"^\s*\*\s*Version:\s*(\S+)", header, re.M)
              if not match:
                  raise SystemExit(f"{slug} has no Version header")
              version = match.group(1)
              parse_version(version)
              previous = manifest.get("plugins", {}).get(slug, {}).get("version", "0")
              if previous != "0" and parse_version(version) < parse_version(previous):
                  raise SystemExit(f"{slug} version {version} is older than published {previous}")
              if previous == "0" or parse_version(version) > parse_version(previous):
                  plan.append({"slug": slug, "version": version})

          json.dump(plan, sys.stdout)
          PY

          targets=$(python3 -c "import json; print(','.join(item['slug'] for item in json.load(open('build/release-plan.json'))))")
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "Plugins to release: ${targets:-none}"

      - name: Build and publish independent ZIPs
        if: steps.plan.outputs.targets != ''
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import subprocess

          for item in json.load(open("build/release-plan.json")):
              slug = item["slug"]
              version = item["version"]
              tag = f"wp-{slug}-{version}"
              archive = os.path.join("build", f"{slug}-{version}.zip")
              subprocess.run([
                  "zip", "-qr", os.path.abspath(archive), slug, "-x", "*/.*"
              ], cwd="WordPress/Plugins", check=True)
              subprocess.run([
                  "gh", "release", "create", tag, archive,
                  "--title", f"{slug} {version}",
                  "--notes", f"Automated release of {slug}, version {version}."
              ], check=True)
          PY
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Update the independent manifest entries
        if: steps.plan.outputs.targets != ''
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          import re

          root = "WordPress/Plugins"
          path = os.path.join(root, "updates.json")
          manifest = {"plugins": {}}
          if os.path.exists(path):
              with open(path, encoding="utf-8") as fh:
                  manifest = json.load(fh)
          manifest.setdefault("plugins", {})

          def header_value(content, field, default=""):
              match = re.search(rf"^\s*\*\s*{re.escape(field)}:\s*(.+)$", content, re.M)
              return match.group(1).strip() if match else default

          for item in json.load(open("build/release-plan.json")):
              slug = item["slug"]
              version = item["version"]
              main = os.path.join(root, slug, f"{slug}.php")
              header = open(main, encoding="utf-8").read(4096)
              manifest["plugins"][slug] = {
                  "version": version,
                  "package": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/wp-{slug}-{version}/{slug}-{version}.zip",
                  "url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/tree/main/WordPress/Plugins/{slug}",
                  "name": header_value(header, "Plugin Name", slug),
                  "requires": header_value(header, "Requires at least", "6.0"),
                  "requires_php": header_value(header, "Requires PHP", "7.4"),
                  "tested": os.environ.get("WP_TESTED", "6.8"),
              }

          manifest["suite_version"] = "independent"
          with open(path, "w", encoding="utf-8", newline="\n") as fh:
              json.dump(manifest, fh, indent=2, ensure_ascii=False)
              fh.write("\n")
          PY
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Commit updated manifest
        if: steps.plan.outputs.targets != ''
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WordPress/Plugins/updates.json
          git commit -m "CI: update individual plugin manifest [skip ci]"
          git push
