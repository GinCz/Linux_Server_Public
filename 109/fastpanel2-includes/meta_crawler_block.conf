# Block Meta crawler from WooCommerce heavy endpoints | v2026-09-09
# = Rooted by VladiMIR | AI =
# Deploy to: /etc/nginx/fastpanel2-includes/meta_crawler_block.conf
# Included in ALL vhosts on 109 via fastpanel2-includes mechanism

# Hard block Meta IPv6 subnet from cart/checkout
location ~* ^/(basket|cart|checkout|wp-cron\.php) {
    if ($is_meta_ip) {
        return 403;
    }
    if ($meta_limit_key = "meta") {
        return 403;
    }
    try_files $uri $uri/ /index.php?$args;
}

# Block Meta from WooCommerce AJAX
location ~* \?wc-ajax= {
    if ($is_meta_ip) {
        return 403;
    }
    if ($meta_limit_key = "meta") {
        return 403;
    }
    try_files $uri $uri/ /index.php?$args;
}
