#
# CrowdSec systemd Memory Limit Override
#
# Problem:
#   CrowdSec has no default MemoryMax in its upstream systemd unit.
#   On servers with 957MB RAM (VPN nodes), CrowdSec consumes ~200MB with
#   no upper bound. On EU-SO-38 (144.124.233.38), systemd auto-assigned
#   an 80MB cgroup limit which caused CrowdSec to be killed by OOM killer
#   in a continuous restart loop (3 OOM events per boot).
#
# Solution:
#   Set explicit MemoryMax=300M to allow normal operation while capping
#   runaway memory usage in case of CrowdSec memory leaks or GeoIP db load.
#
# Deployment:
#   mkdir -p /etc/systemd/system/crowdsec.service.d/
#   cp crowdsec-memory.conf /etc/systemd/system/crowdsec.service.d/memory.conf
#   systemctl daemon-reload
#   systemctl restart crowdsec
#
# Verification:
#   systemctl show crowdsec | grep -E 'MemoryMax|MemoryCurrent'
#
# Deployed to all 10 servers: 2026-05-29

[Service]
# Maximum memory this service may use (hard limit, includes anonymous + file cache)
# CrowdSec with GeoIP database and active parsers uses ~150-200MB normally.
# 300MB gives comfortable headroom without endangering other services.
MemoryMax=300M

# Maximum swap space this service may use in addition to MemoryMax.
# 100MB allows CrowdSec to swap out cold memory pages during idle periods
# without competing for swap with other services.
MemorySwapMax=100M
