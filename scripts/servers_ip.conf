# -----------------------------------------------------------------------------
# Load helper: safe_source_servers_ip
# Usage in other scripts:
#   safe_source_servers_ip || echo "servers_ip.conf not found"
# -----------------------------------------------------------------------------
safe_source_servers_ip() {
  local c1="/root/Linux_Server_Public/scripts/servers_ip.conf"
  local c2="$(dirname "${BASH_SOURCE[0]:-$0}")/servers_ip.conf"

  if [ -f "$c1" ]; then
    # shellcheck disable=SC1090
    source "$c1"
    return 0
  elif [ -f "$c2" ]; then
    # shellcheck disable=SC1090
    source "$c2"
    return 0
  fi
  return 1
}
